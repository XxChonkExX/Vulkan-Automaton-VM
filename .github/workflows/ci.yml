# VulkanVM CI - compile matrix + CPU-only tests.
#
# Uses the toolchains PREINSTALLED on GitHub runners:
#   - ubuntu-latest / windows-latest ship the Vulkan SDK
#   - ubuntu-latest ships the Android NDK (ANDROID_NDK_HOME)
#   - Windows uses Ninja + msvc-dev-cmd (works on any installed VS version)
#
# Hardware-dependent tests (GPU pools, RDMA, Android devices) are NOT run
# here; they require opt-in hardware runners (see docs/HARDWARE_SUPPORT.md).

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    name: Linux (${{ matrix.cc }}) ${{ matrix.mode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        mode: [core, full]
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cc == 'gcc' && 'g++' || 'clang++' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan headers + loader (Ubuntu repos)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan-dev glslc
          test -f /usr/include/vulkan/vulkan.h
          command -v glslc

      - name: Configure (core-only)
        if: matrix.mode == 'core'
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DVVM_BUILD_SHARED=ON -DVVM_BUILD_NETWORK=OFF
          -DVVM_BUILD_TESTS=ON -DVVM_BUILD_EXAMPLES=OFF
          -DVVM_ENABLE_VALIDATION=OFF

      - name: Configure (full stack)
        if: matrix.mode == 'full'
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DVVM_BUILD_SHARED=ON -DVVM_BUILD_NETWORK=ON
          -DVVM_BUILD_TESTS=ON -DVVM_BUILD_EXAMPLES=OFF
          -DVVM_ENABLE_VALIDATION=OFF

      - name: Build
        run: |
          set -o pipefail
          cmake --build build -j"$(nproc)" 2>&1 | tee build.log || { echo "=== BUILD ERROR (last 120 lines) ==="; tail -n 120 build.log; exit 1; }

      - name: CPU-only tests
        run: |
          ctest --test-dir build -R "buddy_test|chonk_slab_test|placement_test" --output-on-failure
          ./build/tests/chonk_slab_test 100000

  windows:
    name: Windows (MSVC) ${{ matrix.mode }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [core, full]
    steps:
      - uses: actions/checkout@v4

      - name: Diagnostics (Windows SDK + tools)
        shell: pwsh
        run: |
          echo "SDK Include dirs:"
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -Directory -ErrorAction SilentlyContinue | ForEach-Object { "  $($_.Name)" }
          echo "ninja: $(Get-Command ninja -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty Source)"
          echo "VULKAN_SDK=$env:VULKAN_SDK"
          if (Test-Path "$env:VULKAN_SDK\Include\vulkan") { echo "SDK headers OK" } else { echo "SDK headers MISSING - will install" ; Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe" -OutFile vulkan-sdk.exe; .\vulkan-sdk.exe --silent --accept-licenses --default-answer --confirm-command install }
      - name: Verify Vulkan SDK present
        shell: pwsh
        run: |
          # The runner may have the SDK installed WITHOUT the VULKAN_SDK env
          # (observed: C:\VulkanSDK\1.4.357.0 present, env empty). Detect it.
          $sdk = $env:VULKAN_SDK
          if (-not $sdk -or -not (Test-Path "$sdk\Include\vulkan")) {
            $found = Get-ChildItem "C:\VulkanSDK" -Directory -ErrorAction SilentlyContinue |
                     Sort-Object Name -Version | Select-Object -Last 1
            if ($found) { $sdk = $found.FullName }
          }
          if (-not $sdk -or -not (Test-Path "$sdk\Include\vulkan")) {
            echo "No SDK found - installing latest..."
            Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe" -OutFile vulkan-sdk.exe
            .\vulkan-sdk.exe --silent --accept-licenses --default-answer --confirm-command install
            $found = Get-ChildItem "C:\VulkanSDK" -Directory -ErrorAction SilentlyContinue |
                     Sort-Object Name -Version | Select-Object -Last 1
            $sdk = $found.FullName
          }
          echo "VULKAN_SDK=$sdk"
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=$sdk"
          Add-Content $env:GITHUB_PATH "$sdk\Bin"
          if (-not (Test-Path "$sdk\Include\vulkan")) { echo "SDK INSTALL FAILED"; exit 1 }
          echo "SDK headers OK"

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (core-only)
        if: matrix.mode == 'core'
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DVVM_BUILD_SHARED=ON -DVVM_BUILD_NETWORK=OFF
          -DVVM_BUILD_TESTS=ON -DVVM_BUILD_EXAMPLES=OFF
          -DVVM_ENABLE_VALIDATION=OFF
        shell: cmd

      - name: Configure (full stack)
        if: matrix.mode == 'full'
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DVVM_BUILD_SHARED=ON -DVVM_BUILD_NETWORK=ON
          -DVVM_BUILD_TESTS=ON -DVVM_BUILD_EXAMPLES=OFF
          -DVVM_ENABLE_VALIDATION=OFF
        shell: cmd

      - name: Build
        run: cmake --build build --config Release > build.log 2>&1 || (type build.log & exit /b 1)
        shell: cmd

      - name: CPU-only tests
        run: |
          ctest --test-dir build -C Release -R "buddy_test|chonk_slab_test|placement_test" --output-on-failure
          .\build\tests\chonk_slab_test.exe 100000
        shell: cmd

  android:
    name: Android (arm64-v8a) compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate preinstalled NDK
        id: ndk
        run: |
          NDK="${ANDROID_NDK_HOME:-/usr/local/lib/android/sdk/ndk-bundle}"
          if [ ! -d "$NDK" ]; then
            NDK=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -1)
          fi
          test -d "$NDK" || { echo "No NDK found"; exit 1; }
          echo "ndk=$NDK" >> "$GITHUB_OUTPUT"
          echo "Using NDK: $NDK"

      - name: Configure + build (arm64-v8a)
        run: |
          cmake -S . -B build-android \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=34 \
            -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DVVM_BUILD_SHARED=ON -DVVM_BUILD_NETWORK=OFF \
            -DVVM_BUILD_TESTS=OFF -DVVM_BUILD_EXAMPLES=OFF
          cmake --build build-android -j"$(nproc)"
        shell: bash




