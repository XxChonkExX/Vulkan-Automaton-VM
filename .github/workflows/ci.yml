# VulkanVM CI - compile matrix + CPU-only tests.
#
# Uses the toolchains PREINSTALLED on GitHub runners:
#   - ubuntu-latest / windows-latest ship the Vulkan SDK
#   - ubuntu-latest ships the Android NDK (ANDROID_NDK_HOME)
#   - Windows uses Ninja + msvc-dev-cmd (works on any installed VS version)
#
# Hardware-dependent tests (GPU pools, RDMA, Android devices) are NOT run
# here; they require opt-in hardware runners (see docs/HARDWARE_SUPPORT.md).

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    name: Linux (${{ matrix.cc }}) ${{ matrix.mode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        mode: [core, full]
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cc == 'gcc' && 'g++' || 'clang++' }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify Vulkan SDK present
        run: |
          echo "VULKAN_SDK=$VULKAN_SDK"
          test -d "$VULKAN_SDK/include/vulkan" || {
            # fallback: modern keyring install (apt-key is gone on 24.04)
            wget -qO- https://packages.lunarg.com/vulkan/lunarg-vulkan-signing-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg-vulkan.asc >/dev/null
            sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
            sudo apt-get update -qq
            sudo apt-get install -y -qq vulkan-sdk
          }

      - name: Configure (core-only)
        if: matrix.mode == 'core'
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DVVM_BUILD_SHARED=ON -DVVM_BUILD_NETWORK=OFF
          -DVVM_BUILD_TESTS=ON -DVVM_BUILD_EXAMPLES=OFF
          -DVVM_ENABLE_VALIDATION=OFF

      - name: Configure (full stack)
        if: matrix.mode == 'full'
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DVVM_BUILD_SHARED=ON -DVVM_BUILD_NETWORK=ON
          -DVVM_BUILD_TESTS=ON -DVVM_BUILD_EXAMPLES=OFF
          -DVVM_ENABLE_VALIDATION=OFF

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: CPU-only tests
        run: |
          ctest --test-dir build -R "buddy_test|chonk_slab_test|placement_test" --output-on-failure
          ./build/tests/chonk_slab_test 100000

  windows:
    name: Windows (MSVC) ${{ matrix.mode }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [core, full]
    steps:
      - uses: actions/checkout@v4

      - name: Verify Vulkan SDK present
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:VULKAN_SDK\Include\vulkan")) {
            Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe" -OutFile vulkan-sdk.exe
            .\vulkan-sdk.exe --silent --accept-licenses --default-answer --confirm-command install
          } else {
            echo "VULKAN_SDK=$env:VULKAN_SDK"
          }

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (core-only)
        if: matrix.mode == 'core'
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DVVM_BUILD_SHARED=ON -DVVM_BUILD_NETWORK=OFF
          -DVVM_BUILD_TESTS=ON -DVVM_BUILD_EXAMPLES=OFF
          -DVVM_ENABLE_VALIDATION=OFF
        shell: cmd

      - name: Configure (full stack)
        if: matrix.mode == 'full'
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DVVM_BUILD_SHARED=ON -DVVM_BUILD_NETWORK=ON
          -DVVM_BUILD_TESTS=ON -DVVM_BUILD_EXAMPLES=OFF
          -DVVM_ENABLE_VALIDATION=OFF
        shell: cmd

      - name: Build
        run: cmake --build build --config Release
        shell: cmd

      - name: CPU-only tests
        run: |
          ctest --test-dir build -C Release -R "buddy_test|chonk_slab_test|placement_test" --output-on-failure
          .\build\tests\chonk_slab_test.exe 100000
        shell: cmd

  android:
    name: Android (arm64-v8a) compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate preinstalled NDK
        id: ndk
        run: |
          NDK="${ANDROID_NDK_HOME:-/usr/local/lib/android/sdk/ndk-bundle}"
          if [ ! -d "$NDK" ]; then
            NDK=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -1)
          fi
          test -d "$NDK" || { echo "No NDK found"; exit 1; }
          echo "ndk=$NDK" >> "$GITHUB_OUTPUT"
          echo "Using NDK: $NDK"

      - name: Configure + build (arm64-v8a)
        run: |
          cmake -S . -B build-android \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=34 \
            -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DVVM_BUILD_SHARED=ON -DVVM_BUILD_NETWORK=OFF \
            -DVVM_BUILD_TESTS=OFF -DVVM_BUILD_EXAMPLES=OFF
          cmake --build build-android -j"$(nproc)"
        shell: bash
